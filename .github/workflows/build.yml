name: Build Temperature API

on:
  push:
    branches: ['codex/temperature-api-1.21.11']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and package
        run: gradle --no-daemon build packageArtifacts
      - name: Verify requested files
        run: |
          test -f build/libs/temperature-api-1.0.0.jar
          test -f build/libs/temperature-api-1.0.0-dev.jar
          test -f build/distributions/temperature-api-1.0.0-src.zip
          unzip -t build/libs/temperature-api-1.0.0.jar
          unzip -t build/libs/temperature-api-1.0.0-dev.jar
          unzip -t build/distributions/temperature-api-1.0.0-src.zip
      - uses: actions/upload-artifact@v4
        with:
          name: temperature-api-1.21.11
          if-no-files-found: error
          path: |
            build/libs/temperature-api-1.0.0.jar
            build/libs/temperature-api-1.0.0-dev.jar
            build/distributions/temperature-api-1.0.0-src.zip
